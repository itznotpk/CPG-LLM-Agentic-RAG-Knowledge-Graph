name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backend/scripts/check_env_example.py
      # Docling currently has an upstream torch.ao import incompatibility.
      - working-directory: backend
        run: pytest -m "not slow and not integration and not live_provider" --ignore=tests/tools/test_convert_pdf.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/doctor-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/doctor-ui/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
