<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClearPath — Sign in</title>
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root{
    --font-display: 'DM Serif Display', 'Times New Roman', serif;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    font-family: var(--font-sans);
    color: var(--fg-primary);
    background: #fff;
    -webkit-font-smoothing: antialiased;
  }

  .page{
    display:grid;
    grid-template-columns: 1.05fr 1fr;
    min-height: 100vh;
    height: 100vh;
  }

  /* ============ LEFT — AESTHETIC ============ */
  .left{
    position: relative;
    background:
      radial-gradient(circle at 20% 110%, rgba(20,184,166,.18) 0%, transparent 55%),
      radial-gradient(circle at 85% 5%, rgba(20,184,166,.12) 0%, transparent 50%),
      linear-gradient(160deg, #f8fafc 0%, #f1f5f9 55%, #e2e8f0 100%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 40px 56px 40px 56px;
    color: var(--slate-900);
  }

  /* faint topographic grid */
  .left::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(15,23,42,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,.04) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 75%);
    pointer-events: none;
  }

  /* soft floating orbs */
  .orb{
    position:absolute; border-radius:50%;
    filter: blur(60px);
    pointer-events:none;
    opacity:.65;
  }
  .orb.a{ width: 480px; height: 480px; left: -120px; bottom: -160px; background: radial-gradient(circle, rgba(20,184,166,.55), transparent 70%); }
  .orb.b{ width: 360px; height: 360px; right: -100px; top: -120px; background: radial-gradient(circle, rgba(94,234,212,.45), transparent 70%); }

  /* topbar */
  .topbar{
    position: relative; z-index: 2;
    display:flex; align-items:center; justify-content: space-between;
  }
  .brand{
    display:flex; align-items:center; gap: 18px;
  }
  .brand .logo{
    height: 52px; width: auto; display:block;
  }
  .brand .logo.mh{
    height: 76px; /* MHNexus PNG has heavy internal padding — bump to match visual weight */
    margin: -10px 0; /* keep row height aligned without shifting layout */
  }
  .brand .sep{
    width: 1px; height: 42px; background: var(--slate-300);
  }
  .topbar .meta{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-muted);
    display:flex; gap: 14px;
  }
  .topbar .meta .dot{
    display:inline-flex; align-items:center; gap:6px;
  }
  .topbar .meta .dot::before{
    content:""; width:6px; height:6px; border-radius:999px; background: var(--success); box-shadow: 0 0 8px var(--success);
    animation: blink 2.2s ease-in-out infinite;
  }
  @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.4} }

  /* hero */
  .hero{
    position: relative; z-index: 2;
    flex: 1;
    display:flex; flex-direction: column; justify-content: center;
    max-width: 640px;
  }
  .hero .wordmark{
    font-family: var(--font-display);
    font-size: 44px;
    line-height: 1;
    letter-spacing: -.02em;
    color: var(--primary-700);
    margin-bottom: 12px;
    font-style: italic;
    display: inline-block;
  }
  .hero .wordmark .dot-end{
    color: var(--primary-500);
    font-style: italic;
  }
  .eyebrow{
    font-size: 11px; letter-spacing:.18em; text-transform: uppercase;
    color: var(--primary-700); font-weight: 600;
    display:inline-flex; align-items:center; gap: 10px;
    margin-bottom: 32px;
  }
  .eyebrow::before{
    content:""; width: 28px; height: 1px; background: var(--primary-600);
  }
  .hero h1{
    font-family: var(--font-display);
    font-size: 64px;
    line-height: 1.05;
    letter-spacing: -.02em;
    font-weight: 400;
    margin: 0 0 44px;
    text-wrap: balance;
    color: var(--slate-900);
  }
  .hero h1 em{
    font-style: italic;
    color: var(--primary-700);
    font-weight: 400;
  }
  .hero .lede{
    font-size: 17px;
    color: var(--fg-secondary);
    line-height: 1.6;
    max-width: 50ch;
    text-wrap: pretty;
    margin: 0 0 40px;
  }

  /* ECG (compact) */
  .ecg{
    position: relative;
    width: 100%;
    height: 64px;
    border-radius: 12px;
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(15,23,42,.06);
    backdrop-filter: blur(8px);
    overflow:hidden;
    margin-bottom: 24px;
  }
  .ecg svg{ width:100%; height:100%; display:block; }
  .ecg .ecg-path{
    fill: none;
    stroke: var(--primary-600);
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1400;
    stroke-dashoffset: 1400;
    animation: traceLine 4.5s linear infinite;
    filter: drop-shadow(0 0 4px rgba(20,184,166,.5));
  }
  @keyframes traceLine{
    0% { stroke-dashoffset: 1400; }
    70%{ stroke-dashoffset: 0; }
    100%{ stroke-dashoffset: -1400; }
  }
  .ecg .scan{
    position:absolute; top:0; bottom:0; width: 60px;
    background: linear-gradient(90deg, transparent, rgba(20,184,166,.18), transparent);
    animation: scanMove 4.5s linear infinite;
  }
  @keyframes scanMove{
    0%{ left: -60px; } 100%{ left: 100%; }
  }
  .ecg .ecg-label{
    position:absolute; left: 14px; top: 10px;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--primary-700); letter-spacing: .12em;
  }
  .ecg .ecg-val{
    position:absolute; right: 14px; bottom: 8px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--slate-600);
  }
  .ecg .ecg-val b{ color: var(--slate-900); font-weight: 600; }

  /* feature cards — ClearPath differentiators */
  .features{
    position: relative; z-index: 2;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 640px;
  }
  .feat{
    position: relative;
    background: #fff;
    border: 1px solid var(--slate-200);
    border-top: 2px solid var(--accent, var(--primary-600));
    border-radius: 12px;
    padding: 18px 18px 16px;
    box-shadow: var(--shadow-sm);
    transition: transform var(--dur) var(--ease-spring), box-shadow var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out);
  }
  .feat:hover{
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
  }
  .feat .num{
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-weight: 600;
    color: var(--accent, var(--primary-600));
    margin-bottom: 10px;
    display:inline-block;
  }
  .feat h3{
    font-family: var(--font-sans);
    font-size: 15.5px;
    line-height: 1.3;
    letter-spacing: -.005em;
    font-weight: 600;
    color: var(--slate-900);
    margin: 0 0 8px;
    text-wrap: balance;
  }
  .feat p{
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--fg-secondary);
    margin: 0;
    text-wrap: pretty;
  }
  .feat.c1{ --accent: var(--primary-600); }
  .feat.c2{ --accent: var(--accent-emerald); }
  .feat.c3{ --accent: var(--accent-amber); }

  @media (max-width: 1180px){
    .features{ grid-template-columns: 1fr; gap: 8px; }
  }

  /* footer left */
  .left-foot{
    position: relative; z-index: 2;
    margin-top: 24px;
    display:flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--fg-muted);
  }
  .left-foot .v{ font-family: var(--font-mono); letter-spacing: .04em; }

  /* ============ RIGHT — LOGIN ============ */
  .right{
    background: linear-gradient(180deg, #fafbfc 0%, #ffffff 100%);
    display:flex; flex-direction: column;
    padding: 32px 40px;
    position: relative;
  }

  /* faint scaffold dots in the right panel for visual depth */
  .right::before{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(rgba(15,23,42,.06) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 80%);
    pointer-events: none;
    opacity: .5;
  }
  .right > *{ position: relative; z-index: 1; }
  .right .top-row{
    display:flex; justify-content: flex-end; gap: 18px;
    font-size: 13px; color: var(--fg-muted);
  }
  .right .top-row a{
    color: var(--fg-secondary);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: color var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out);
  }
  .right .top-row a:hover{ color: var(--primary-700); border-color: var(--primary-300); }

  .auth{
    width: 100%;
  }
  .auth h2{
    font-size: 32px; letter-spacing: -.02em; font-weight: 600;
    margin: 0 0 10px;
  }
  .auth .sub{
    font-size: 15px; color: var(--fg-secondary); margin: 0 0 36px;
  }
  .auth .sub b{ color: var(--slate-900); font-weight: 600; }

  /* form */
  .field{ display:flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .field label{
    font-size: 12.5px;
    font-weight: 500;
    color: var(--fg-secondary);
    display:flex; justify-content: space-between; align-items: center;
  }
  .field label .forgot{
    font-size: 12px; color: var(--primary-700); text-decoration: none;
  }
  .field label .forgot:hover{ text-decoration: underline; }
  .input-wrap{
    position:relative;
    display:flex; align-items: center;
  }
  .input-wrap svg.lead{
    position:absolute; left: 14px;
    width: 16px; height: 16px;
    color: var(--slate-400);
    pointer-events: none;
  }
  .input-wrap input{
    width: 100%;
    height: 48px;
    background: var(--slate-50);
    border: 1px solid var(--slate-200);
    border-radius: var(--radius);
    padding: 0 16px 0 42px;
    font-family: var(--font-sans);
    font-size: 14.5px;
    color: var(--slate-900);
    outline: none;
    transition: border-color var(--dur) var(--ease-out), background var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out);
  }
  .input-wrap input::placeholder{ color: var(--slate-400); }
  .input-wrap input:hover{ border-color: var(--slate-300); background: #fff; }
  .input-wrap input:focus{
    border-color: var(--primary-500);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(20,184,166,.12);
  }
  .input-wrap .toggle-eye{
    position:absolute; right: 14px;
    background: transparent; border: 0; cursor: pointer;
    color: var(--slate-400); padding: 4px;
    display:flex; align-items: center;
  }
  .input-wrap .toggle-eye:hover{ color: var(--slate-700); }
  .input-wrap .toggle-eye svg{ width: 16px; height: 16px; }

  .row-between{
    display:flex; align-items: center; justify-content: space-between;
    margin: 8px 0 24px;
  }
  .check{
    display:inline-flex; align-items: center; gap: 9px;
    font-size: 13px; color: var(--fg-secondary);
    cursor: pointer; user-select: none;
  }
  .check input{ display:none; }
  .check .box{
    width: 16px; height: 16px; border-radius: 5px;
    border: 1.5px solid var(--slate-300);
    background: #fff;
    display:inline-flex; align-items:center; justify-content:center;
    color: #fff;
    transition: background var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out);
  }
  .check .box svg{ width: 11px; height: 11px; opacity: 0; transition: opacity var(--dur) var(--ease-out); }
  .check input:checked + .box{ background: var(--primary-600); border-color: var(--primary-600); }
  .check input:checked + .box svg{ opacity: 1; }

  .btn-primary{
    width: 100%;
    height: 50px;
    border: 0;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
    color: #fff;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .002em;
    cursor: pointer;
    box-shadow: var(--shadow-accent);
    transition: transform var(--dur) var(--ease-spring), box-shadow var(--dur) var(--ease-out), filter var(--dur) var(--ease-out);
    display:inline-flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-primary:hover{ box-shadow: var(--shadow-accent-lg); filter: brightness(1.04); }
  .btn-primary:active{ transform: translateY(1px); }
  .btn-primary svg{ width: 16px; height: 16px; transition: transform var(--dur) var(--ease-out); }
  .btn-primary:hover svg{ transform: translateX(3px); }

  .divider{
    display:flex; align-items: center; gap: 14px;
    margin: 26px 0 20px;
    color: var(--fg-muted); font-size: 11px;
    letter-spacing: .14em; text-transform: uppercase; font-weight: 500;
  }
  .divider::before, .divider::after{
    content:""; flex:1; height: 1px; background: var(--slate-200);
  }

  .sso{
    display:grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .sso button{
    height: 46px;
    border-radius: var(--radius);
    border: 1px solid var(--slate-200);
    background: #fff;
    font-family: var(--font-sans);
    font-size: 13.5px;
    font-weight: 500;
    color: var(--slate-700);
    cursor: pointer;
    display:inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: border-color var(--dur) var(--ease-out), background var(--dur) var(--ease-out), color var(--dur) var(--ease-out);
  }
  .sso button:hover{
    border-color: var(--primary-400);
    background: var(--primary-50);
    color: var(--primary-700);
  }
  .sso button svg{ width: 16px; height: 16px; color: var(--slate-500); }
  .sso button:hover svg{ color: var(--primary-600); }

  .right-foot{
    margin-top: 20px;
    display:flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--fg-muted);
  }
  .right-foot .req{
    color: var(--fg-secondary); text-decoration: none;
  }
  .right-foot .req b{ color: var(--primary-700); font-weight: 600; }
  .right-foot .legal{ font-family: var(--font-mono); }

  /* ============ 3D HOVER CARD ============ */
  .card-wrap{
    flex: 1;
    display:flex; align-items: center; justify-content: center;
    perspective: 1500px;
    padding: 18px 0;
  }
  .card{
    position: relative;
    width: 100%;
    max-width: 440px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(12px);
    border: 1px solid var(--slate-200);
    border-radius: 22px;
    padding: 36px 36px 32px;
    box-shadow:
      0 30px 60px -25px rgba(15,23,42,.18),
      0 10px 24px -12px rgba(15,23,42,.08);
    transform-style: preserve-3d;
    transition: transform .35s cubic-bezier(.2,.7,.3,1), box-shadow .35s ease-out, border-color .35s ease-out;
    will-change: transform;
  }
  .card:hover{
    border-color: rgba(20,184,166,.35);
    box-shadow:
      0 40px 80px -25px rgba(15,23,42,.22),
      0 14px 30px -12px rgba(20,184,166,.18);
  }
  /* subtle diagonal scaffold inside the card */
  .card::before{
    content:"";
    position:absolute; inset:0;
    border-radius: 22px;
    background-image:
      linear-gradient(135deg, rgba(15,23,42,.04) .5px, transparent .5px),
      linear-gradient(45deg, rgba(15,23,42,.04) .5px, transparent .5px);
    background-size: 28px 28px;
    opacity: .35;
    pointer-events: none;
    mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 90%);
  }
  .card > *{ position: relative; z-index: 1; }

  /* outer border-light system */
  .beams{
    position: absolute; inset: -1px;
    border-radius: 22px;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .beam{
    position: absolute;
    filter: blur(1.2px);
  }
  .beam.top, .beam.bot{ height: 2px; width: 45%; }
  .beam.lft, .beam.rgt{ width: 2px; height: 45%; }
  .beam.top{ top: 0; background: linear-gradient(90deg, transparent, var(--primary-500), transparent); animation: beamTop 3.6s cubic-bezier(.55,.05,.45,1) infinite; }
  .beam.rgt{ right: 0; background: linear-gradient(180deg, transparent, var(--primary-500), transparent); animation: beamRgt 3.6s cubic-bezier(.55,.05,.45,1) infinite .9s; }
  .beam.bot{ bottom: 0; background: linear-gradient(-90deg, transparent, var(--primary-500), transparent); animation: beamBot 3.6s cubic-bezier(.55,.05,.45,1) infinite 1.8s; }
  .beam.lft{ left: 0; background: linear-gradient(0deg, transparent, var(--primary-500), transparent); animation: beamLft 3.6s cubic-bezier(.55,.05,.45,1) infinite 2.7s; }

  @keyframes beamTop{
    0%   { left: -45%; opacity: 0; }
    10%  { opacity: .7; }
    65%  { opacity: .7; }
    75%  { left: 100%; opacity: 0; }
    100% { left: 100%; opacity: 0; }
  }
  @keyframes beamRgt{
    0%   { top: -45%; opacity: 0; }
    10%  { opacity: .7; }
    65%  { opacity: .7; }
    75%  { top: 100%; opacity: 0; }
    100% { top: 100%; opacity: 0; }
  }
  @keyframes beamBot{
    0%   { right: -45%; opacity: 0; }
    10%  { opacity: .7; }
    65%  { opacity: .7; }
    75%  { right: 100%; opacity: 0; }
    100% { right: 100%; opacity: 0; }
  }
  @keyframes beamLft{
    0%   { bottom: -45%; opacity: 0; }
    10%  { opacity: .7; }
    65%  { opacity: .7; }
    75%  { bottom: 100%; opacity: 0; }
    100% { bottom: 100%; opacity: 0; }
  }

  /* corner glow spots */
  .corner{
    position: absolute;
    border-radius: 999px;
    background: var(--primary-500);
    filter: blur(1.5px);
    animation: cornerPulse 2.4s ease-in-out infinite;
  }
  .corner.tl{ top: -1px; left: -1px;   width: 5px;  height: 5px; opacity: .45; }
  .corner.tr{ top: -2px; right: -2px;  width: 8px;  height: 8px; opacity: .65; animation-delay: .5s; }
  .corner.br{ bottom: -2px; right: -2px; width: 8px; height: 8px; opacity: .65; animation-delay: 1s; }
  .corner.bl{ bottom: -1px; left: -1px; width: 5px; height: 5px; opacity: .45; animation-delay: 1.5s; }
  @keyframes cornerPulse{
    0%,100% { opacity: .25; transform: scale(.85); }
    50%     { opacity: .75; transform: scale(1.15); }
  }

  /* breathing border halo */
  .halo{
    position: absolute; inset: -1px;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(20,184,166,.0), rgba(20,184,166,.18), rgba(20,184,166,.0));
    opacity: .2;
    pointer-events: none;
    z-index: 0;
    animation: haloBreath 5s ease-in-out infinite;
  }
  @keyframes haloBreath{
    0%,100%{ opacity: .15; }
    50%    { opacity: .35; }
  }
  .card:hover .halo{ opacity: .55; }

  /* respect reduced motion */
  @media (prefers-reduced-motion: reduce){
    .beam, .corner, .halo, .card{ animation: none !important; transition: none !important; }
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 980px){
    html, body{ overflow: auto; height: auto; }
    .page{ grid-template-columns: 1fr; height: auto; }
    .left{ min-height: 360px; padding: 32px 28px 28px; }
    .hero h1{ font-size: 36px; }
    .right{ padding: 32px 20px; }
    .card{ padding: 28px 24px; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- ============ LEFT ============ -->
  <section class="left" aria-label="MHNexus product brand panel">
    <div class="orb a"></div>
    <div class="orb b"></div>

    <header class="topbar">
      <div class="brand">
        <img class="logo" src="UniMalaya.png" alt="University of Malaya" />
        <span class="sep" aria-hidden="true"></span>
        <img class="logo mh" src="MHNexus.png" alt="MHNexus" />
      </div>
    </header>

    <div class="hero">
      <div class="wordmark">ClearPath<span class="dot-end">.</span></div>
      <span class="eyebrow">Evidence-Based Clinical Practice Guidance System</span>
      <h1>Clinician's <em>second opinion</em>, at the speed of a glance.</h1>

      <div class="ecg" aria-hidden="true">
        <span class="ecg-label">LIVE · ECG II</span>
        <svg viewBox="0 0 700 88" preserveAspectRatio="none">
          <path class="ecg-path" d="
            M 0 44 L 60 44 L 80 44 L 95 40 L 110 48 L 125 44 L 160 44
            L 180 44 L 195 28 L 205 64 L 215 8 L 225 78 L 235 44
            L 280 44 L 310 44 L 325 38 L 340 50 L 355 44 L 400 44
            L 420 44 L 435 28 L 445 64 L 455 8 L 465 78 L 475 44
            L 520 44 L 555 44 L 570 40 L 585 48 L 600 44 L 700 44
          " />
        </svg>
        <div class="scan"></div>
        <div class="ecg-val">HR <b>72</b> bpm &nbsp;·&nbsp; SpO<sub>2</sub> <b>98</b>%</div>
      </div>
    </div>
  </section>

  <!-- ============ RIGHT ============ -->
  <section class="right" aria-label="Sign in">
    <div class="top-row">
      <span>New here?</span>
      <a href="#">Request access</a>
    </div>

    <div class="card-wrap">
      <div class="card" id="card3d">
        <span class="halo" aria-hidden="true"></span>
        <div class="beams" aria-hidden="true">
          <span class="beam top"></span>
          <span class="beam rgt"></span>
          <span class="beam bot"></span>
          <span class="beam lft"></span>
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner br"></span>
          <span class="corner bl"></span>
        </div>

        <form class="auth" autocomplete="off" onsubmit="event.preventDefault();">
      <h2>Welcome Back</h2>
      <p class="sub" id="welcomeSub">Sign in to pick up where you left off.</p>

      <div class="field">
        <label for="email">Work email</label>
        <div class="input-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
          <input id="email" type="email" inputmode="email" placeholder="dr.tay@mhnexus.com" autocomplete="username" />
        </div>
      </div>

      <div class="field">
        <label for="password">
          <span>Password</span>
          <a class="forgot" href="#">Forgot password?</a>
        </label>
        <div class="input-wrap">
          <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input id="password" type="password" placeholder="••••••••••" autocomplete="current-password" />
          <button type="button" class="toggle-eye" aria-label="Show password" onclick="(function(b){var i=b.previousElementSibling;var on=i.type==='password';i.type=on?'text':'password';b.firstElementChild.style.opacity=on?.5:1})(this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <div class="row-between">
        <label class="check">
          <input type="checkbox" checked />
          <span class="box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>
          </span>
          Keep me signed in for 8 hours
        </label>
      </div>

      <button type="submit" class="btn-primary">
        Sign in
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
      </button>
    </form>
      </div>
    </div>

  </section>

</div>

<script>
  // Dynamic, generic welcome subhead — rotates without naming anyone
  (function(){
    const h = new Date().getHours();
    const greeting = h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening';
    const lines = [
      'Sign in to pick up where you left off.',
      `Good ${greeting} \u2014 sign in to view today's schedule.`,
      'Sign in to access your ClearPath workspace.',
      'Welcome to today\u2019s queue. Sign in to continue.'
    ];
    const el = document.getElementById('welcomeSub');
    if (el) el.textContent = lines[Math.floor(Math.random() * lines.length)];
  })();

  // 3D mouse-tilt for the sign-in card
  (function(){
    const wrap = document.querySelector('.card-wrap');
    const card = document.getElementById('card3d');
    if (!wrap || !card) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const MAX_TILT = 8;     // degrees
    const LIFT = 6;         // px translateZ on hover

    let raf = 0;
    function setTilt(rx, ry, lift){
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        card.style.transform = `rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateZ(${lift}px)`;
      });
    }

    wrap.addEventListener('mousemove', (e) => {
      const r = card.getBoundingClientRect();
      const cx = e.clientX - r.left - r.width / 2;
      const cy = e.clientY - r.top - r.height / 2;
      const rx = (cy / (r.height / 2)) * -MAX_TILT;
      const ry = (cx / (r.width  / 2)) *  MAX_TILT;
      setTilt(rx, ry, LIFT);
    });

    wrap.addEventListener('mouseleave', () => {
      setTilt(0, 0, 0);
    });
  })();
</script>

</body>
</html>
