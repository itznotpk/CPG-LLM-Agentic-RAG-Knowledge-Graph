<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Reasoning Trace — Redesigned</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --font-sans: 'Geist', system-ui, -apple-system, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, monospace;

  /* teal accent */
  --teal-50:#f0fdfa; --teal-100:#ccfbf1; --teal-200:#99f6e4;
  --teal-500:#14b8a6; --teal-600:#0d9488; --teal-700:#0f766e;

  /* slate */
  --sl-50:#f8fafc; --sl-100:#f1f5f9; --sl-200:#e2e8f0;
  --sl-300:#cbd5e1; --sl-400:#94a3b8; --sl-500:#64748b;
  --sl-600:#475569; --sl-700:#334155; --sl-800:#1e293b; --sl-900:#0f172a;

  /* indigo — header */
  --ind-50:#eef2ff; --ind-100:#e0e7ff; --ind-200:#c7d2fe;
  --ind-600:#4f46e5; --ind-700:#4338ca;

  /* green — complete / applied */
  --grn-50:#f0fdf4; --grn-100:#dcfce7; --grn-200:#bbf7d0;
  --grn-600:#16a34a; --grn-700:#15803d;

  /* amber — warning / override / rerank */
  --amb-50:#fffbeb; --amb-100:#fef3c7; --amb-200:#fde68a;
  --amb-600:#d97706; --amb-700:#b45309;

  /* red — excluded */
  --red-50:#fef2f2; --red-100:#fee2e2;
  --red-600:#dc2626; --red-700:#b91c1c;

  /* blue — callout / chips */
  --blu-50:#eff6ff; --blu-100:#dbeafe; --blu-200:#bfdbfe;
  --blu-600:#2563eb; --blu-700:#1d4ed8;

  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:20px;
  --shadow-sm:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow:0 2px 8px rgba(15,23,42,.08),0 1px 3px rgba(15,23,42,.04);
  --shadow-md:0 4px 16px rgba(15,23,42,.1),0 2px 6px rgba(15,23,42,.06);
}

body {
  font-family: var(--font-sans);
  background: #dde3ec;
  min-height: 100vh;
  padding: 40px 20px 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  -webkit-font-smoothing: antialiased;
}

.page-eyebrow {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--sl-400);
}

/* ── Panel shell ─────────────────────────────────────────────────────── */
.panel {
  width: 460px;
  max-width: 100%;
  background: #fff;
  border: 1.5px solid var(--sl-200);
  border-radius: var(--r-xl);
  overflow: hidden;
  box-shadow: var(--shadow-md);
}

/* ── Panel header ────────────────────────────────────────────────────── */
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 18px;
  background: var(--ind-50);
  border-bottom: 1.5px solid var(--ind-100);
  cursor: pointer; user-select: none;
}
.panel-header-left { display: flex; align-items: center; gap: 8px; }
.panel-header-title { font-size: 14px; font-weight: 600; color: var(--ind-700); }
.panel-header-meta  { font-size: 12px; color: var(--sl-400); }

/* ── Stage section ───────────────────────────────────────────────────── */
.stage { border-top: 1px solid var(--sl-100); }
.stage:first-child { border-top: none; }

.stage-hdr {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px 12px;
  cursor: pointer; user-select: none;
}
.stage-dot {
  width: 22px; height: 22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.stage-dot.done  { background: var(--grn-100); color: var(--grn-600); }
.stage-dot.num   { background: var(--sl-100); color: var(--sl-400);
                   font-size: 11px; font-weight: 700; font-family: var(--font-mono); }
.stage-title     { font-size: 14px; font-weight: 600; color: var(--sl-800); flex: 1; }
.stage-meta      { font-size: 12px; color: var(--sl-400); white-space: nowrap; }

.stage-body { padding: 0 18px 18px; }

/* ── Search callout ──────────────────────────────────────────────────── */
.search-callout {
  background: var(--blu-50); border: 1px solid var(--blu-100);
  border-radius: var(--r); padding: 10px 12px; margin-bottom: 12px;
}
.eyebrow {
  font-size: 10px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; margin-bottom: 4px;
}
.eyebrow.blue   { color: var(--blu-600); }
.eyebrow.indigo { color: var(--ind-600); }
.eyebrow.amber  { color: var(--amb-600); }
.eyebrow.green  { color: var(--grn-600); }
.eyebrow.slate  { color: var(--sl-500); }
.search-text { font-size: 13px; color: var(--sl-700); line-height: 1.5; }

/* ── Condition chips ─────────────────────────────────────────────────── */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip {
  font-size: 12px; font-weight: 500; padding: 4px 10px;
  border-radius: 999px; border: 1px solid;
}
.chip.blue { background: var(--blu-50); border-color: var(--blu-200); color: var(--blu-700); }
.chip.teal { background: var(--teal-50); border-color: var(--teal-200); color: var(--teal-700); }

/* ── Candidate cards ─────────────────────────────────────────────────── */
.candidates { display: flex; flex-direction: column; gap: 7px; }

.cand-card {
  border: 1px solid var(--sl-200); border-radius: var(--r);
  overflow: hidden; background: #fff;
  transition: box-shadow .15s;
}
.cand-card:hover { box-shadow: var(--shadow); }

.cand-main {
  display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px;
}
.rank-circle {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; border: 1.5px solid; margin-top: 1px;
}
.rank-circle.r1 { background: var(--teal-50);  border-color: var(--teal-200); color: var(--teal-700); }
.rank-circle.r2 { background: var(--sl-100); border-color: var(--sl-200); color: var(--sl-600); }
.rank-circle.rn { background: var(--sl-50);  border-color: var(--sl-200); color: var(--sl-400); }

.cand-body { flex: 1; min-width: 0; }
.cand-top  { display: flex; align-items: flex-start; gap: 8px; justify-content: space-between; }

.cand-code {
  font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  color: var(--teal-600); letter-spacing: .02em;
}
.cand-name {
  font-size: 13px; color: var(--sl-700); line-height: 1.4; margin-top: 2px;
}
.cand-ctx { font-size: 11px; color: var(--sl-400); margin-top: 4px; }

.move-badge {
  font-size: 11px; font-weight: 700; padding: 2px 6px;
  border-radius: 999px; flex-shrink: 0; margin-top: 1px;
}
.move-badge.up   { background: var(--grn-100); color: var(--grn-700); }
.move-badge.down { background: var(--red-100);  color: var(--red-700); }
.move-badge.same { background: var(--sl-100);   color: var(--sl-500); }

/* re-rank callout strip */
.rerank-strip {
  display: flex; align-items: flex-start; gap: 7px;
  padding: 8px 12px;
  background: var(--amb-50);
  border-top: 1px solid var(--amb-100);
  border-left: 3px solid var(--amb-600);
}
.rerank-label { font-size: 11px; font-weight: 600; color: var(--amb-600); flex-shrink: 0; white-space: nowrap; }
.rerank-text  { font-size: 12px; color: var(--amb-700); line-height: 1.5; }

/* score breakdown toggle */
.score-btn {
  display: flex; align-items: center; gap: 4px;
  width: 100%; padding: 5px 12px;
  background: none; border: none; border-top: 1px solid var(--sl-100);
  cursor: pointer; font-family: var(--font-sans); font-size: 11px;
  color: var(--sl-400); text-align: left; transition: color .15s;
}
.score-btn:hover { color: var(--sl-600); }
.score-detail {
  padding: 8px 12px; background: var(--sl-50);
  border-top: 1px solid var(--sl-100);
  font-size: 11px; color: var(--sl-500); display: flex; flex-wrap: wrap; gap: 10px; line-height: 1.6;
}
.score-val { font-family: var(--font-mono); font-weight: 600; }

/* show-more toggle */
.more-btn {
  display: flex; align-items: center; gap: 5px;
  background: none; border: none; cursor: pointer;
  font-family: var(--font-sans); font-size: 12px; color: var(--sl-500);
  padding: 5px 0; margin-top: 4px; transition: color .15s;
}
.more-btn:hover { color: var(--sl-700); }

/* ── Clinician override banner ───────────────────────────────────────── */
.override-banner {
  display: flex; align-items: flex-start; gap: 10px;
  margin: 4px 18px 0;
  padding: 10px 12px;
  background: var(--amb-50); border: 1px solid var(--amb-200);
  border-radius: var(--r); border-left: 3px solid var(--amb-600);
}
.override-body { flex: 1; }
.override-label { font-size: 11px; font-weight: 600; color: var(--amb-700); margin-bottom: 6px; }
.override-codes { display: flex; flex-wrap: wrap; gap: 5px; }
.override-chip {
  display: flex; align-items: center; gap: 5px; padding: 3px 9px;
  border-radius: 999px; background: #fff;
  border: 1px solid var(--amb-200);
}
.override-chip .code { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--teal-600); }
.override-chip .name { font-size: 11px; color: var(--sl-600); }

/* ── CPG applied rows ────────────────────────────────────────────────── */
.cpg-applied { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.cpg-row {
  display: flex; align-items: center; gap: 8px; padding: 9px 11px;
  border-radius: var(--r-sm); background: var(--grn-50);
  border: 1px solid var(--grn-100);
}
.cpg-name  { flex: 1; font-size: 13px; color: var(--sl-700); }
.badge {
  font-size: 11px; font-weight: 500; padding: 2px 8px;
  border-radius: 999px; border: 1px solid; flex-shrink: 0;
}
.badge.exact   { background: var(--grn-100); border-color: var(--grn-200); color: var(--grn-700); }
.badge.warn    { background: var(--amb-100); border-color: var(--amb-200); color: var(--amb-700); }
.badge.excl    { background: var(--red-100); border-color: #fca5a5;        color: var(--red-700); }

/* under-evidenced warning */
.cpg-warn {
  display: flex; align-items: flex-start; gap: 8px; padding: 8px 11px;
  border-radius: var(--r-sm); background: var(--amb-50);
  border: 1px solid var(--amb-100); margin-bottom: 8px;
}
.cpg-warn-text { font-size: 12px; color: var(--amb-700); line-height: 1.5; }

/* excluded toggle */
.excl-toggle {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 9px 11px; border-radius: var(--r-sm);
  background: var(--sl-50); border: 1px solid var(--sl-200);
  cursor: pointer; font-family: var(--font-sans); font-size: 12px;
  color: var(--sl-500); transition: background .15s;
}
.excl-toggle:hover { background: var(--sl-100); }
.excl-list { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
.excl-row {
  display: flex; align-items: flex-start; gap: 8px; padding: 8px 11px;
  border-radius: var(--r-sm); background: var(--red-50);
  border: 1px solid var(--red-100);
}
.excl-row-info { flex: 1; }
.excl-row-name   { font-size: 12px; color: var(--sl-600); }
.excl-row-reason { font-size: 11px; color: var(--sl-400); margin-top: 2px; }

/* ── Evidence section ────────────────────────────────────────────────── */
.ev-group-label {
  font-size: 10px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--sl-500);
  margin: 12px 0 6px; display: flex; align-items: center; gap: 6px;
}
.ev-group-label:first-child { margin-top: 0; }
.ev-count-pill {
  font-size: 10px; font-weight: 600; padding: 1px 6px;
  border-radius: 999px; background: var(--sl-100); color: var(--sl-500);
}

.ev-questions { display: flex; flex-direction: column; gap: 3px; }
.ev-row {
  border: 1px solid var(--sl-100); border-radius: var(--r-sm);
  background: #fff; overflow: hidden;
  transition: border-color .15s;
}
.ev-row:hover { border-color: var(--sl-200); }

.ev-row-main {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 9px 10px; cursor: pointer;
}
.ev-row-text { flex: 1; font-size: 12px; color: var(--sl-600); line-height: 1.55; }
.ev-passages-badge {
  font-size: 11px; font-weight: 600; padding: 2px 7px;
  border-radius: 999px; flex-shrink: 0; margin-top: 1px;
  background: var(--teal-50); border: 1px solid var(--teal-100); color: var(--teal-700);
}

.ev-summary-line {
  padding: 9px 11px; background: var(--sl-50);
  border: 1px solid var(--sl-100); border-radius: var(--r-sm);
  font-size: 12px; font-weight: 600; color: var(--sl-600);
  margin-top: 8px; text-align: center;
}

/* ── Shared icon wrapper ─────────────────────────────────────────────── */
.ic { display: block; flex-shrink: 0; }

/* ── Panel footer ────────────────────────────────────────────────────── */
.panel-footer {
  padding: 10px 18px; border-top: 1px solid var(--sl-100);
  font-size: 11px; color: var(--sl-400); background: var(--sl-50);
}

/* ── Timeline rail ─────────────────────────────────────────────────────── */
.tl-body { padding: 4px 0 0; }
.tl-item { display: flex; }
.tl-left {
  display: flex; flex-direction: column; align-items: center;
  width: 46px; flex-shrink: 0;
  padding-top: 16px;
}
.tl-dot {
  width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 1; border: 1.5px solid;
}
.tl-dot.done     { background: var(--grn-100); border-color: var(--grn-200); color: var(--grn-600); }
.tl-dot.override { background: var(--amb-100); border-color: var(--amb-200); color: var(--amb-600); }
.tl-line {
  width: 2px; flex: 1; min-height: 16px;
  background: var(--grn-200); margin-top: 4px; border-radius: 1px;
}
.tl-line.amber { background: var(--amb-200); }
.tl-right { flex: 1; min-width: 0; padding-right: 18px; }
/* When inside timeline, stages handle their own horizontal spacing */
.tl-right .stage { border-top: none; }
.tl-right .stage-hdr { padding: 14px 0 12px; }
.tl-right .stage-body { padding: 0 0 18px; }
.tl-override-content { padding: 13px 0 16px; }
.tl-right .override-banner { margin: 0; }

/* ── Dark mode ───────────────────────────────────────────────────────── */
.dark-toggle {
  position: fixed; top: 16px; right: 16px;
  display: flex; align-items: center; gap: 7px;
  background: #fff; border: 1px solid var(--sl-200);
  border-radius: 999px; padding: 5px 12px;
  font-size: 12px; font-weight: 500; color: var(--sl-600);
  cursor: pointer; box-shadow: var(--shadow-sm);
  font-family: var(--font-sans);
  transition: background .15s;
}
.dark-toggle:hover { background: var(--sl-50); }

/* Dark mode overrides */
.dark body { background: #0f172a; }
.dark .panel { background: var(--sl-800); border-color: rgba(255,255,255,.08); }
.dark .panel-header { background: rgba(79,70,229,.12); border-color: rgba(99,102,241,.25); }
.dark .panel-header-title { color: #a5b4fc; }
.dark .panel-header-meta  { color: var(--sl-500); }
.dark .stage { border-top-color: rgba(255,255,255,.06); }
.dark .stage-title { color: var(--sl-200); }
.dark .stage-dot.num { background: rgba(255,255,255,.06); color: var(--sl-500); }
.dark .stage-body {}
.dark .search-callout { background: rgba(59,130,246,.08); border-color: rgba(59,130,246,.2); }
.dark .search-text { color: var(--sl-300); }
.dark .eyebrow.blue { color: #93c5fd; }
.dark .eyebrow.indigo { color: #a5b4fc; }
.dark .eyebrow.amber { color: #fcd34d; }
.dark .eyebrow.green { color: #86efac; }
.dark .eyebrow.slate { color: var(--sl-400); }
.dark .chip.blue { background: rgba(59,130,246,.1); border-color: rgba(59,130,246,.2); color: #93c5fd; }
.dark .cand-card { background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.08); }
.dark .cand-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.dark .cand-name { color: var(--sl-300); }
.dark .cand-ctx  { color: var(--sl-600); }
.dark .cand-code { color: #2dd4bf; }
.dark .rerank-strip { background: rgba(217,119,6,.08); border-top-color: rgba(217,119,6,.2); border-left-color: #fbbf24; }
.dark .rerank-label { color: #fcd34d; }
.dark .rerank-text  { color: #fde68a; }
.dark .score-btn  { border-top-color: rgba(255,255,255,.06); color: var(--sl-600); }
.dark .score-btn:hover { color: var(--sl-400); }
.dark .score-detail { background: rgba(255,255,255,.03); border-top-color: rgba(255,255,255,.06); color: var(--sl-400); }
.dark .override-banner { background: rgba(217,119,6,.08); border-color: rgba(217,119,6,.2); border-left-color: #f59e0b; }
.dark .override-label { color: #fcd34d; }
.dark .override-chip { background: rgba(255,255,255,.04); border-color: rgba(217,119,6,.25); }
.dark .override-chip .name { color: var(--sl-400); }
.dark .cpg-row { background: rgba(22,163,74,.07); border-color: rgba(22,163,74,.2); }
.dark .cpg-name { color: var(--sl-300); }
.dark .badge.exact { background: rgba(22,163,74,.15); border-color: rgba(22,163,74,.3); color: #86efac; }
.dark .cpg-warn { background: rgba(217,119,6,.08); border-color: rgba(217,119,6,.2); }
.dark .cpg-warn-text { color: #fcd34d; }
.dark .excl-toggle { background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.08); color: var(--sl-500); }
.dark .excl-toggle:hover { background: rgba(255,255,255,.06); }
.dark .excl-row { background: rgba(220,38,38,.06); border-color: rgba(220,38,38,.15); }
.dark .excl-row-name { color: var(--sl-400); }
.dark .excl-row-reason { color: var(--sl-600); }
.dark .badge.excl { background: rgba(220,38,38,.15); border-color: rgba(220,38,38,.3); color: #fca5a5; }
.dark .ev-group-label { color: var(--sl-500); }
.dark .ev-count-pill { background: rgba(255,255,255,.06); color: var(--sl-500); }
.dark .ev-row { background: rgba(255,255,255,.02); border-color: rgba(255,255,255,.06); }
.dark .ev-row:hover { border-color: rgba(255,255,255,.12); }
.dark .ev-row-text { color: var(--sl-400); }
.dark .ev-passages-badge { background: rgba(20,184,166,.1); border-color: rgba(20,184,166,.2); color: #5eead4; }
.dark .ev-summary-line { background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.06); color: var(--sl-400); }
.dark .panel-footer { background: rgba(255,255,255,.02); border-top-color: rgba(255,255,255,.06); color: var(--sl-600); }
.dark .dark-toggle { background: var(--sl-800); border-color: rgba(255,255,255,.1); color: var(--sl-300); }
.dark .dark-toggle:hover { background: var(--sl-700); }
.dark .rank-circle.r1 { background: rgba(20,184,166,.15); border-color: rgba(20,184,166,.3); }
.dark .rank-circle.r2 { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.1); color: var(--sl-400); }
.dark .rank-circle.rn { background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.08); color: var(--sl-600); }
.dark .more-btn { color: var(--sl-500); }
.dark .more-btn:hover { color: var(--sl-300); }
.dark .page-eyebrow { color: var(--sl-600); }
.dark .move-badge.up   { background: rgba(22,163,74,.2); color: #86efac; }
.dark .move-badge.down { background: rgba(220,38,38,.2); color: #fca5a5; }
.dark .move-badge.same { background: rgba(255,255,255,.06); color: var(--sl-500); }
.dark .tl-dot.done     { background: rgba(22,163,74,.15);  border-color: rgba(22,163,74,.3);  color: #86efac; }
.dark .tl-dot.override { background: rgba(217,119,6,.15); border-color: rgba(217,119,6,.3); color: #fcd34d; }
.dark .tl-line         { background: rgba(22,163,74,.22); }
.dark .tl-line.amber   { background: rgba(217,119,6,.22); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

/* ────────────────────────────────────────────────
   INLINE SVG ICONS
───────────────────────────────────────────────── */
function SvgIcon({ children, size = 16, style = {} }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={1.8} strokeLinecap="round" strokeLinejoin="round"
      style={{ display:'block', flexShrink:0, ...style }}>
      {children}
    </svg>
  );
}
const IconCheck     = ({s=14}) => <SvgIcon size={s}><polyline points="20 6 9 17 4 12"/></SvgIcon>;
const IconChevD     = ({s=13}) => <SvgIcon size={s}><polyline points="6 9 12 15 18 9"/></SvgIcon>;
const IconChevU     = ({s=13}) => <SvgIcon size={s}><polyline points="18 15 12 9 6 15"/></SvgIcon>;
const IconChevR     = ({s=13}) => <SvgIcon size={s}><polyline points="9 18 15 12 9 6"/></SvgIcon>;
const IconBrain     = ({s=15}) => <SvgIcon size={s} style={{strokeWidth:1.5}}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46 2.5 2.5 0 0 1-1.07-4.56 3 3 0 0 1 .61-5.71A2.5 2.5 0 0 1 9.5 2"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46 2.5 2.5 0 0 0 1.07-4.56 3 3 0 0 0-.61-5.71A2.5 2.5 0 0 0 14.5 2"/></SvgIcon>;
const IconEdit      = ({s=14}) => <SvgIcon size={s} style={{strokeWidth:1.5}}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></SvgIcon>;
const IconBook      = ({s=14}) => <SvgIcon size={s} style={{strokeWidth:1.5}}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></SvgIcon>;
const IconX         = ({s=12}) => <SvgIcon size={s}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></SvgIcon>;
const IconWarn      = ({s=14}) => <SvgIcon size={s} style={{strokeWidth:1.5}}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></SvgIcon>;
const IconSearch    = ({s=13}) => <SvgIcon size={s} style={{strokeWidth:1.5}}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></SvgIcon>;
const IconSparkles  = ({s=14}) => <SvgIcon size={s} style={{strokeWidth:1.5}}><path d="M12 3l1.09 3.26L16.35 7.5l-3.26 1.09L12 11.86l-1.09-3.27L7.65 7.5l3.26-1.24z"/><path d="M19 14l.82 2.45L22.27 17.5l-2.45.82L19 20.77l-.82-2.45L15.73 17.5l2.45-.82z"/><path d="M5 18l.55 1.63L7.18 20.5l-1.63.55L5 22.63l-.55-1.58L2.82 20.5l1.63-.55z"/></SvgIcon>;
const IconMoon      = ({s=14}) => <SvgIcon size={s} style={{strokeWidth:1.5}}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></SvgIcon>;
const IconSun       = ({s=14}) => <SvgIcon size={s} style={{strokeWidth:1.5}}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></SvgIcon>;

/* ────────────────────────────────────────────────
   MOCK DATA  (from screenshots)
───────────────────────────────────────────────── */
const TRACE = {
  summary: { elapsed: 104.5, icdCount: 3, cpgCount: 4 },
  ddx: {
    searchQuery: "newly diagnosed for Heart failure, Heart failure with reduced ejection fraction, Type 2 diabetes mellitus",
    conditions: ["Heart failure with reduced Ejection Fraction", "Type 2 Diabetes Mellitus", "Obesity"],
    candidates: [
      { rank:1, code:"BD11.2",  title:"Left ventricular failure with reduced ejection fraction", mathRank:2, delta:+1,  override:null },
      { rank:2, code:"5A11",    title:"Type 2 diabetes mellitus",                                 mathRank:1, delta:-1,  override:null },
      { rank:3, code:"5B81.0",  title:"Obesity due to energy imbalance",                          mathRank:6, delta:+3,  override:"More exact diagnosis — Obesity confirmed by BMI 32.0" },
      { rank:7, code:"BD1Y",    title:"Other specified heart failure",                             mathRank:7, delta:0,   override:"More exact diagnosis — BD11.2 (HFrEF) confirmed by LVEF 25" },
      { rank:8, code:"5A13.7",  title:"Diabetes mellitus due to other specified causes",          mathRank:5, delta:-3,  override:"More exact diagnosis — 5A11 (Type 2 DM) confirmed by HbA1c 8.4" },
    ],
    scoreBreakdowns: {
      "BD11.2":  { base:0.78, incl:"+0.24", excl:"−0.00", final:1.02 },
      "5A11":    { base:0.81, incl:"+0.18", excl:"−0.00", final:0.99 },
      "5B81.0":  { base:0.62, incl:"+0.15", excl:"−0.00", final:0.77 },
      "BD1Y":    { base:0.55, incl:"+0.10", excl:"−0.08", final:0.57 },
      "5A13.7":  { base:0.59, incl:"+0.08", excl:"−0.12", final:0.55 },
    }
  },
  override: [
    { code:"BD11.2", name:"Left ventricular failure with reduced ejection fraction" },
    { code:"5A11",   name:"Type 2 diabetes mellitus" },
    { code:"5B81.0", name:"Obesity due to energy imbalance" },
  ],
  cpg: {
    applied: [
      { name:"Heart-Failure (5th Edition)",           type:"exact" },
      { name:"T2-Diabetes-Mellitus (6th Edition)",    type:"exact" },
      { name:"Obesity-Management (2023)",             type:"exact" },
    ],
    flags: ["5A11 is under-evidenced — backed by 1 CPG, expected 3"],
    excluded: [
      { name:"Diabetes-in-Pregnancy (2017)",     reason:"Female-only guideline — patient is male" },
      { name:"CVD-Prevention-Women (2016)",       reason:"Female-only guideline — patient is male" },
    ]
  },
  evidence: {
    total: 20,
    aiQuestions: [
      { text:"In patients with heart failure with reduced ejection fraction (LVEF 25%) and NYHA Class II symptoms, guideline-directed medical therapy should include an ACE inhibitor/ARB, a beta-blocker, and a mineralocorticoid receptor antagonist.", passages:5 },
      { text:"Metformin should be temporarily discontinued in patients with heart failure experiencing acute decompensation or conditions predisposing to lactic acidosis.", passages:5 },
      { text:"Patients initiating or up-titrating mineralocorticoid receptor antagonists for heart failure require monitoring of serum potassium and renal function within 1 week and then regularly thereafter.", passages:5 },
      { text:"Metformin dose should be adjusted based on eGFR in patients with type 2 diabetes and heart failure, with discontinuation if eGFR falls below 30 mL/min/1.73m².", passages:3 },
      { text:"Patients with heart failure NYHA Class II symptoms and LVEF 25% who remain symptomatic despite optimal medical therapy should be considered for further advanced therapies or referral to a heart failure specialist.", passages:4 },
      { text:"Patients with heart failure, type 2 diabetes, and obesity should receive comprehensive counselling on sodium restriction, fluid management, regular physical activity, weight loss strategies, and smoking cessation.", passages:4 },
      { text:"Patients with newly diagnosed heart failure NYHA Class II and LVEF 25% should have a follow-up visit within 1–2 weeks after initiation or dose titration of guideline-directed medical therapy.", passages:5 },
    ],
    alwaysChecks: [
      { text:"Specialist referrals indicated and their urgency for this patient",                                        passages:5 },
      { text:"Lifestyle modifications, diet, exercise, weight, smoking, alcohol recommendations for this patient",       passages:5 },
      { text:"Baseline investigations, tests, and imaging indicated for this patient's diagnosis",                       passages:5 },
    ]
  }
};

/* ────────────────────────────────────────────────
   CANDIDATE CARD
───────────────────────────────────────────────── */
function CandidateCard({ c, sb }) {
  const [scoreOpen, setScoreOpen] = useState(false);
  const rank = c.rank;
  const circleClass = rank === 1 ? 'r1' : rank <= 3 ? 'r2' : 'rn';
  const moveCls = c.delta > 0 ? 'up' : c.delta < 0 ? 'down' : 'same';
  const moveLabel = c.delta > 0 ? `↑${c.delta}` : c.delta < 0 ? `↓${Math.abs(c.delta)}` : `=`;

  return (
    <div className="cand-card">
      <div className="cand-main">
        <div className={`rank-circle ${circleClass}`}>{rank}</div>
        <div className="cand-body">
          <div className="cand-top">
            <div>
              <div className="cand-code">{c.code}</div>
              <div className="cand-name">{c.title}</div>
              {c.mathRank != null && (
                <div className="cand-ctx">Evidence rank #{c.mathRank} → AI rank #{rank}</div>
              )}
            </div>
            <span className={`move-badge ${moveCls}`}>{moveLabel}</span>
          </div>
        </div>
      </div>

      {c.override && (
        <div className="rerank-strip">
          <span className="rerank-label">Re-ranked:</span>
          <span className="rerank-text">{c.override}</span>
        </div>
      )}

      {sb && (
        <>
          <button className="score-btn" onClick={() => setScoreOpen(o => !o)}>
            {scoreOpen ? <IconChevU /> : <IconChevD />}
            {scoreOpen ? "Hide score breakdown" : "Score breakdown"}
          </button>
          {scoreOpen && (
            <div className="score-detail">
              <span>Base <span className="score-val">{sb.base.toFixed(2)}</span></span>
              <span style={{color:'var(--grn-600)'}}>Inclusion <span className="score-val">{sb.incl}</span></span>
              <span style={{color:'var(--red-600)'}}>Exclusion <span className="score-val">{sb.excl}</span></span>
              <span>= Evidence <span className="score-val" style={{fontWeight:700}}>{sb.final.toFixed(2)}</span></span>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ────────────────────────────────────────────────
   EVIDENCE QUESTION ROW
───────────────────────────────────────────────── */
function EvidenceRow({ q }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="ev-row">
      <div className="ev-row-main" onClick={() => setOpen(o => !o)}>
        <span style={{color:'var(--sl-400)', marginTop:2, flexShrink:0}}>
          {open ? <IconChevU s={12}/> : <IconChevD s={12}/>}
        </span>
        <span className="ev-row-text">{q.text}</span>
        <span className="ev-passages-badge">+{q.passages}</span>
      </div>
      {open && (
        <div style={{
          padding:'8px 10px 10px 28px',
          borderTop:'1px solid var(--sl-100)',
          background:'var(--sl-50)',
          fontSize:11,
          color:'var(--sl-500)',
          lineHeight:1.5
        }}>
          Retrieved {q.passages} new guideline passage{q.passages > 1 ? 's' : ''} from matched CPGs.
        </div>
      )}
    </div>
  );
}

/* ────────────────────────────────────────────────
   DDX STAGE
───────────────────────────────────────────────── */
function DDxStage({ data, open, onToggle }) {
  const [showAll, setShowAll] = useState(false);
  const top3 = data.candidates.slice(0, 3);
  const rest = data.candidates.slice(3);
  const shown = showAll ? data.candidates : top3;

  return (
    <div className="stage">
      <div className="stage-hdr" onClick={onToggle}>
        <span className="stage-title">Diagnosis Ranking</span>
        <span className="stage-meta">top: BD11.2</span>
        <span style={{color:'var(--sl-400)', marginLeft:4}}>
          {open ? <IconChevU s={13}/> : <IconChevD s={13}/>}
        </span>
      </div>

      {open && (
        <div className="stage-body">
          {/* Search query callout */}
          <div className="search-callout">
            <div className="eyebrow blue" style={{display:'flex', alignItems:'center', gap:5}}>
              <IconSearch s={11}/> AI searched for
            </div>
            <div className="search-text">"{data.searchQuery}"</div>
          </div>

          {/* Conditions considered */}
          <div className="eyebrow indigo" style={{marginBottom:6}}>Conditions considered</div>
          <div className="chips">
            {data.conditions.map((c, i) => (
              <span key={i} className="chip blue">{c}</span>
            ))}
          </div>

          {/* Candidate cards */}
          <div className="candidates">
            {shown.map(c => (
              <CandidateCard key={c.code} c={c} sb={data.scoreBreakdowns[c.code]} />
            ))}
          </div>

          {rest.length > 0 && (
            <button className="more-btn" onClick={() => setShowAll(o => !o)}>
              {showAll ? <IconChevU s={12}/> : <IconChevD s={12}/>}
              {showAll
                ? `Hide ${rest.length} lower-ranked candidates`
                : `Show ${rest.length} more candidates`}
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ────────────────────────────────────────────────
   CLINICIAN OVERRIDE BANNER
───────────────────────────────────────────────── */
function OverrideBanner({ codes }) {
  return (
    <div className="override-banner">
      <span style={{color:'var(--amb-600)', marginTop:1}}><IconEdit s={14}/></span>
      <div className="override-body">
        <div className="override-label">Clinician confirmed diagnoses</div>
        <div className="override-codes">
          {codes.map(d => (
            <div key={d.code} className="override-chip">
              <span className="code">{d.code}</span>
              <span className="name">{d.name}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────────
   CPG STAGE
───────────────────────────────────────────────── */
function CPGStage({ data, open, onToggle }) {
  const [exclOpen, setExclOpen] = useState(false);

  return (
    <div className="stage">
      <div className="stage-hdr" onClick={onToggle}>
        <span className="stage-title">Guideline Matching</span>
        <span className="stage-meta">{data.applied.length} applied</span>
        <span style={{color:'var(--sl-400)', marginLeft:4}}>
          {open ? <IconChevU s={13}/> : <IconChevD s={13}/>}
        </span>
      </div>

      {open && (
        <div className="stage-body">
          {/* Applied */}
          <div className="eyebrow green" style={{marginBottom:6}}>
            Applied guidelines
          </div>
          <div className="cpg-applied">
            {data.applied.map((g, i) => (
              <div key={i} className="cpg-row">
                <span style={{color:'var(--grn-600)', flexShrink:0}}><IconCheck s={13}/></span>
                <span className="cpg-name">{g.name}</span>
                <span className={`badge ${g.type}`}>{g.type}</span>
              </div>
            ))}
          </div>

          {/* Flags */}
          {data.flags.map((f, i) => (
            <div key={i} className="cpg-warn">
              <span style={{color:'var(--amb-600)', flexShrink:0, marginTop:1}}><IconWarn s={13}/></span>
              <span className="cpg-warn-text">{f}</span>
            </div>
          ))}

          {/* Excluded toggle */}
          <button className="excl-toggle" onClick={() => setExclOpen(o => !o)}>
            <span style={{display:'flex', alignItems:'center', gap:6}}>
              <span style={{color:'var(--red-600)'}}><IconX s={11}/></span>
              {data.excluded.length} guidelines excluded — click to see why
            </span>
            {exclOpen ? <IconChevU s={12}/> : <IconChevD s={12}/>}
          </button>

          {exclOpen && (
            <div className="excl-list">
              {data.excluded.map((e, i) => (
                <div key={i} className="excl-row">
                  <span style={{color:'var(--red-600)', marginTop:2, flexShrink:0}}><IconX s={11}/></span>
                  <div className="excl-row-info">
                    <div className="excl-row-name">{e.name}</div>
                    <div className="excl-row-reason">{e.reason}</div>
                  </div>
                  <span className="badge excl">excluded</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ────────────────────────────────────────────────
   EVIDENCE STAGE
───────────────────────────────────────────────── */
function EvidenceStage({ data, open, onToggle }) {
  return (
    <div className="stage">
      <div className="stage-hdr" onClick={onToggle}>
        <span className="stage-title">Evidence Retrieved</span>
        <span className="stage-meta">{data.total} passages</span>
        <span style={{color:'var(--sl-400)', marginLeft:4}}>
          {open ? <IconChevU s={13}/> : <IconChevD s={13}/>}
        </span>
      </div>

      {open && (
        <div className="stage-body">
          {/* AI questions */}
          <div className="ev-group-label">
            <IconSparkles s={11}/>
            AI-generated questions
            <span className="ev-count-pill">{data.aiQuestions.length}</span>
          </div>
          <div className="ev-questions">
            {data.aiQuestions.map((q, i) => <EvidenceRow key={i} q={q} />)}
          </div>

          {/* Standard checks */}
          <div className="ev-group-label">
            <IconBook s={11}/>
            Standard checks always run
            <span className="ev-count-pill">{data.alwaysChecks.length}</span>
          </div>
          <div className="ev-questions">
            {data.alwaysChecks.map((q, i) => <EvidenceRow key={i} q={q} />)}
          </div>

          <div className="ev-summary-line">
            {data.total} guideline passages retrieved · duplicates removed
          </div>
        </div>
      )}
    </div>
  );
}

/* ────────────────────────────────────────────────
   TIMELINE ITEM
───────────────────────────────────────────────── */
function TimelineItem({ dot, lineClass = '', isLast = false, children }) {
  return (
    <div className="tl-item">
      <div className="tl-left">
        {dot}
        {!isLast && <div className={`tl-line ${lineClass}`} />}
      </div>
      <div className="tl-right">
        {children}
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────────
   MAIN PANEL
───────────────────────────────────────────────── */
function TracePanel({ trace }) {
  const [panelOpen, setPanelOpen]     = useState(true);
  const [ddxOpen,   setDdxOpen]       = useState(true);
  const [cpgOpen,   setCpgOpen]       = useState(true);
  const [evOpen,    setEvOpen]        = useState(true);

  const { summary, ddx, override, cpg, evidence } = trace;
  const metaStr = `${summary.elapsed}s · ${summary.icdCount} ICD codes · ${summary.cpgCount} CPGs`;

  return (
    <div className="panel">
      {/* Header */}
      <div className="panel-header" onClick={() => setPanelOpen(o => !o)}>
        <div className="panel-header-left">
          <span style={{color:'#6366f1'}}><IconBrain s={15}/></span>
          <span className="panel-header-title">AI Reasoning Trace</span>
          <span className="panel-header-meta">{metaStr}</span>
        </div>
        <span style={{color:'#a5b4fc'}}>
          {panelOpen ? <IconChevU s={14}/> : <IconChevD s={14}/>}
        </span>
      </div>

      {panelOpen && (
        <div className="tl-body">

          <TimelineItem dot={<div className="tl-dot done"><IconCheck s={11}/></div>}>
            <DDxStage data={ddx} open={ddxOpen} onToggle={() => setDdxOpen(o => !o)} />
          </TimelineItem>

          <TimelineItem dot={<div className="tl-dot override"><IconEdit s={12}/></div>} lineClass="amber">
            <div className="tl-override-content">
              <OverrideBanner codes={override} />
            </div>
          </TimelineItem>

          <TimelineItem dot={<div className="tl-dot done"><IconCheck s={11}/></div>}>
            <CPGStage data={cpg} open={cpgOpen} onToggle={() => setCpgOpen(o => !o)} />
          </TimelineItem>

          <TimelineItem dot={<div className="tl-dot done"><IconCheck s={11}/></div>} isLast={true}>
            <EvidenceStage data={evidence} open={evOpen} onToggle={() => setEvOpen(o => !o)} />
          </TimelineItem>

          <div className="panel-footer">
            Powered by Gemini 2.5 Flash · Evidence grounded in Malaysian CPGs
          </div>
        </div>
      )}
    </div>
  );
}

/* ────────────────────────────────────────────────
   APP
───────────────────────────────────────────────── */
function App() {
  const [dark, setDark] = useState(false);

  React.useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
  }, [dark]);

  return (
    <>
      <button className="dark-toggle" onClick={() => setDark(d => !d)}>
        {dark ? <IconSun s={13}/> : <IconMoon s={13}/>}
        {dark ? 'Light' : 'Dark'}
      </button>

      <div style={{display:'flex', flexDirection:'column', alignItems:'center', gap:12, width:'100%'}}>
        <p className="page-eyebrow">AI Reasoning Trace — Redesigned</p>
        <TracePanel trace={TRACE} />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
